<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>

  .wrap{padding:30px 32px;font-family:var(--font-heading);color:var(--foreground);}

  .lg{font-size:30px;line-height:1.1;margin-top:14px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);

<body><div class="wrap">
  <div class="xl">the everything but AI company.</div>
  <div class="lg">open source scheduling infrastructure</div>
