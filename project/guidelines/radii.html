<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Base 10px — xs · sm · md · lg · xl · 2xl · full" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--background);}
  .wrap{padding:26px 30px;display:flex;gap:16px;align-items:flex-end;font-family:var(--font-mono);}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:64px;height:64px;background:var(--muted);border:1px solid var(--border);}
  .lbl{font-size:10px;color:var(--muted-foreground);}
</style></head>
<body><div class="wrap">
  <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="lbl">xs · 4</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm · 6</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md · 8</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg · 10</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl · 14</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="lbl">2xl · 16</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-full)"></div><span class="lbl">full</span></div>
</div></body></html>
