<!-- @dsCard group="Type" viewport="700x180" name="Mono — Paper Mono" subtitle="Code, keys & technical detail" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--background);}
  .wrap{padding:30px 32px;font-family:var(--font-mono);color:var(--foreground);}
  .code{font-size:15px;line-height:1.7;}
  .chip{display:inline-block;background:var(--primary);color:var(--primary-foreground);
    padding:2px 7px;border-radius:var(--radius-xs);transform:rotate(-1deg);}
  .muted{color:var(--muted-foreground);}
  .meta{font-size:11px;color:var(--muted-foreground);text-transform:uppercase;
    letter-spacing:.05em;margin-top:18px;}
</style></head>
<body><div class="wrap">
  <div class="code"><span class="muted">$</span> npm install <span class="chip">@coss</span></div>
  <div class="code" style="margin-top:8px">COSS_KEY=ITSTIMETOBUILD</div>
  <div class="code muted" style="margin-top:8px">// 0123456789 · {} =&gt; () [] &amp;&amp; |</div>
  <div class="meta">Paper Mono · 400 · --font-mono</div>
</div></body></html>
