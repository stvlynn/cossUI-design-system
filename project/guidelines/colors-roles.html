<!-- @dsCard group="Colors" viewport="700x150" name="Action roles" subtitle="primary, secondary, accent, muted with their foregrounds" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--background);}
  .wrap{padding:26px 30px;display:flex;gap:14px;font-family:var(--font-mono);}
  .sw{flex:1;height:72px;border-radius:var(--radius-lg);display:flex;align-items:center;
    justify-content:center;font-size:12px;border:1px solid var(--border);}
</style></head>
<body><div class="wrap">
  <div class="sw" style="background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)">primary</div>
  <div class="sw" style="background:var(--secondary);color:var(--secondary-foreground)">secondary</div>
  <div class="sw" style="background:var(--accent);color:var(--accent-foreground)">accent</div>
  <div class="sw" style="background:var(--muted);color:var(--muted-foreground)">muted</div>
</div></body></html>
