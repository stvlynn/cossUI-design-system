<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Whisper-quiet — hairline borders do the work" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--sidebar);}
  .wrap{padding:30px;display:flex;gap:22px;font-family:var(--font-mono);}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:118px;height:74px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-2xl);}
  .lbl{font-size:10px;color:var(--muted-foreground);}
</style></head>
<body><div class="wrap">
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="lbl">shadow-xs</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="lbl">shadow-sm</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="lbl">shadow-md</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xs),var(--inset-highlight)"></div><span class="lbl">+ inset top-light</span></div>
</div></body></html>
