<!-- @dsCard group="Type" viewport="700x230" name="Body — Cal Sans UI" subtitle="UI & prose, variable weight 300–700" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0;background:var(--background);}
  .wrap{padding:30px 32px;font-family:var(--font-sans);color:var(--foreground);}
  .lead{font-size:18px;line-height:1.6;max-width:54ch;}
  .body{font-size:14px;line-height:1.6;color:var(--muted-foreground);max-width:60ch;margin-top:12px;}
  .weights{display:flex;gap:22px;margin-top:18px;font-size:18px;}
  .weights span{display:flex;flex-direction:column;gap:2px;}
  .weights small{font-family:var(--font-mono);font-size:10px;color:var(--muted-foreground);}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground);
    text-transform:uppercase;letter-spacing:.05em;margin-top:16px;}
</style></head>
<body><div class="wrap">
  <div class="lead">open source is the foundation of all modern software.</div>
  <div class="body">every app, website and system we use today is built on open source — the most important driver of global GDP growth.</div>
  <div class="weights">
    <span><b style="font-weight:300">Light</b><small>300</small></span>
    <span><b style="font-weight:400">Regular</b><small>400</small></span>
    <span><b style="font-weight:500">Medium</b><small>500</small></span>
    <span><b style="font-weight:600">Semibold</b><small>600</small></span>
  </div>
  <div class="meta">Cal Sans UI · --font-sans</div>
</div></body></html>
