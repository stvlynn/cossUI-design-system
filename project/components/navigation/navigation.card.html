<script type="text/babel">
  const { Tabs, TabsList, TabsTrigger, TabsContent } = window.CossComDesignSystem_a96ea9;
  function Demo() {
    return (
      <Tabs defaultValue="cli">
        <TabsList>
          <TabsTrigger value="cli">CLI</TabsTrigger>
          <TabsTrigger value="manual">Manual</TabsTrigger>
          <TabsTrigger value="env">.env</TabsTrigger>
        </TabsList>
        <TabsContent value="cli"><div className="panel">npx coss add button</div></TabsContent>
        <TabsContent value="manual"><div className="panel">Copy the component source into your project.</div></TabsContent>
        <TabsContent value="env"><div className="panel">COSS_KEY=ITSTIMETOBUILD</div></TabsContent>
      </Tabs>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
