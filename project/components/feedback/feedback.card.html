<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; background: var(--background); }
  .wrap { padding: 28px; display: flex; flex-direction: column; gap: 12px; }
  .spinrow { display: flex; align-items: center; gap: 18px; margin-top: 6px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em;
    text-transform: uppercase; color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Alert, AlertTitle, AlertDescription, Spinner, Button } = window.CossComDesignSystem_a96ea9;
  const svg = (paths) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{paths}</svg>
  );
  const Info = svg(<><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>);
  const Check = svg(<><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></>);
  const Warn = svg(<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></>);
  const XC = svg(<><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></>);
  function Demo() {
    return (
      <>
        <Alert variant="info" icon={Info}>
          <AlertTitle>Upcoming product</AlertTitle>
          <AlertDescription>coss calendar is in early access — join the waitlist.</AlertDescription>
        </Alert>
        <Alert variant="success" icon={Check}>
          <AlertTitle>Deployed</AlertTitle>
          <AlertDescription>Your COSS_KEY is live in production.</AlertDescription>
        </Alert>
        <Alert variant="warning" icon={Warn}>
          <AlertTitle>Sandbox only</AlertTitle>
          <AlertDescription>Switch to production before going live.</AlertDescription>
        </Alert>
        <Alert variant="error" icon={XC}>
          <AlertTitle>Webhook failed</AlertTitle>
          <AlertDescription>Signature could not be verified.</AlertDescription>
        </Alert>
        <div className="spinrow">
          <span className="lbl">Spinner</span>
          <Spinner size={16} />
          <Spinner size={22} />
          <Button variant="default" size="sm"><Spinner size={14} /> Saving</Button>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
